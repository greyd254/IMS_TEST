<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Sửa thiết bị')}"></head>
<body>
<th:block th:replace="~{layout :: menu('thiet-bi')}"></th:block>

<main class="noi-dung">
  <div class="container-xxl hep">
    <th:block th:replace="~{layout :: thongbao}"></th:block>

    <a th:href="@{/admin/thiet-bi}" class="quay-lai"><i class="bi bi-arrow-left"></i> Quay lại danh sách thiết bị</a>

    <div class="card">
      <div class="card-header">
        <i class="bi bi-pencil-square"></i>Sửa thiết bị #<span th:text="${tb.maTb}"></span>
      </div>
      <div class="card-body">
        <form th:action="@{/admin/thiet-bi/{id}(id=${tb.maTb})}" method="post" class="row g-3">
          <div class="col-md-7">
            <label class="form-label" for="tenTb">Tên thiết bị <span class="text-danger">*</span></label>
            <input class="form-control" id="tenTb" name="tenTb" maxlength="150" required th:value="${tb.tenTb}">
          </div>
          <div class="col-md-5 col-6">
            <label class="form-label" for="loaiTb">Loại</label>
            <select class="form-select" id="loaiTb" name="loaiTb">
              <option th:each="e : ${dsLoai}" th:value="${e.key}" th:text="${e.value}"
                      th:selected="${e.key == tb.loaiTb}"></option>
            </select>
          </div>
          <div class="col-md-7 col-6">
            <label class="form-label" for="maPhong">Phòng <span class="text-danger">*</span></label>
            <select class="form-select" id="maPhong" name="maPhong" required>
              <option th:each="p : ${dsPhong}" th:value="${p.maPhong}" th:text="${p.tenPhong}"
                      th:selected="${p.maPhong == tb.maPhong}"></option>
            </select>
          </div>
          <div class="col-md-5">
            <label class="form-label" for="tinhTrang">Tình trạng</label>
            <select class="form-select" id="tinhTrang" name="tinhTrang">
              <option th:each="e : ${dsTinhTrang}" th:value="${e.key}" th:text="${e.value}"
                      th:selected="${e.key == tb.tinhTrang}"></option>
            </select>
          </div>
          <div class="col-md-7">
            <label class="form-label" for="nhaCungCap">Nhà cung cấp</label>
            <input class="form-control" id="nhaCungCap" name="nhaCungCap" maxlength="150" th:value="${tb.nhaCungCap}">
          </div>
          <div class="col-md-5">
            <label class="form-label" for="ngayLapDat">Ngày lắp đặt</label>
            <input class="form-control" type="date" id="ngayLapDat" name="ngayLapDat" th:value="${tb.ngayLapDat}">
          </div>
          <div class="col-12">
            <label class="form-label" for="hdsd">Hướng dẫn sử dụng</label>
            <textarea class="form-control" id="hdsd" name="hdsd" rows="3" maxlength="2000" th:text="${tb.hdsd}"></textarea>
          </div>
          <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Lưu</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/thiet-bi}">Hủy</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
</body>
</html>
