# Kích hoạt khi chạy trong Docker (SPRING_PROFILES_ACTIVE=docker trong docker-compose.yml).
# Ghi access log của Tomcat thẳng ra stdout -> theo dõi real-time bằng "docker logs -f suco-app".
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.file-date-format=
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern=remote=%h time="%t" method=%m uri="%U" query="%q" status=%s bytes=%b duration=%{ms}Tms referer="%{Referer}i" agent="%{User-Agent}i"
