<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Quản lý danh mục sự cố')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: thongbao}"></div>

<div class="container">
  <!-- Form thêm danh mục mới -->
  <div class="card mb-4">
    <div class="card-header"><i class="bi bi-tag"></i>Thêm danh mục</div>
    <div class="card-body">
      <form th:action="@{/admin/danh-muc}" method="post" class="row g-3">
        <div class="col-md-4">
          <label class="form-label" for="tenDm">Tên danh mục</label>
          <input class="form-control" id="tenDm" name="tenDm" maxlength="100" required>
        </div>
        <div class="col-md-7">
          <label class="form-label" for="moTa">Mô tả</label>
          <input class="form-control" id="moTa" name="moTa" maxlength="500">
        </div>
        <div class="col-md-1 d-flex align-items-end">
          <button class="btn btn-primary w-100" type="submit"><i class="bi bi-plus-lg"></i></button>
        </div>
      </form>
    </div>
  </div>

  <div th:replace="~{layout :: tieuDe('bi-tags','Danh sách danh mục')}"></div>
  <div class="card">
    <div class="table-responsive">
      <table class="table table-striped align-middle mb-0">
        <thead><tr><th>Mã</th><th>Tên danh mục</th><th>Mô tả</th><th></th></tr></thead>
        <tbody>
          <tr th:each="dm : ${dsDanhMuc}">
            <td th:text="${dm.maDm}"></td>
            <td th:text="${dm.tenDm}"></td>
            <td th:text="${dm.moTa}"></td>
            <td class="text-nowrap">
              <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/danh-muc/{id}/sua(id=${dm.maDm})}"><i class="bi bi-pencil-square"></i> Sửa</a>
              <form class="d-inline" th:action="@{/admin/danh-muc/{id}/xoa(id=${dm.maDm})}" method="post"
                    onsubmit="return confirm('Xóa danh mục này?');">
                <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i> Xóa</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(dsDanhMuc)}">
            <td colspan="4" class="trong-rong"><i class="bi bi-inbox"></i>Chưa có danh mục</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
