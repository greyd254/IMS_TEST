<!DOCTYPE html>
<!-- Layout chung: các trang gọi các fragment bên dưới bằng th:replace="~{layout :: ten_fragment}" -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(tieuDe)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${tieuDe} + ' - Quản lý sự cố CNTT'">Quản lý sự cố CNTT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.xuong-dong { white-space: pre-line; }</style>
</head>
<body>

<!-- Thanh điều hướng: hiển thị tên người đăng nhập và nút Đăng xuất -->
<nav th:fragment="navbar" class="navbar navbar-expand-md navbar-dark bg-primary mb-4">
  <div class="container">
    <span class="navbar-brand">Sự cố CNTT - ĐH GTVT</span>
    <ul class="navbar-nav me-auto">
      <li class="nav-item" th:unless="${session.nguoiDung.laAdmin()}">
        <a class="nav-link" th:href="@{/user}">Báo sự cố</a>
      </li>
      <li class="nav-item" th:if="${session.nguoiDung.laAdmin()}">
        <a class="nav-link" th:href="@{/admin}">Quản lý sự cố</a>
      </li>
      <li class="nav-item" th:if="${session.nguoiDung.laAdmin()}">
        <a class="nav-link" th:href="@{/admin/thiet-bi}">Thiết bị</a>
      </li>
      <li class="nav-item" th:if="${session.nguoiDung.laAdmin()}">
        <a class="nav-link" th:href="@{/admin/nguoi-dung}">Người dùng</a>
      </li>
      <li class="nav-item"><a class="nav-link" th:href="@{/kinh-nghiem}">Kho kinh nghiệm</a></li>
    </ul>
    <span class="navbar-text me-3">
      <span th:text="${session.nguoiDung.hoTen}">Tên</span>
      (<span th:text="${session.nguoiDung.vaiTro}">USER</span>)
    </span>
    <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Đăng xuất</a>
  </div>
</nav>

<!-- Thông báo thành công / lỗi (truyền qua flash attribute sau khi redirect) -->
<div th:fragment="thongbao" class="container">
  <div class="alert alert-success" th:if="${thongBao}" th:text="${thongBao}"></div>
  <div class="alert alert-danger" th:if="${loi}" th:text="${loi}"></div>
</div>

<!-- Nhãn trạng thái sự cố -->
<span th:fragment="trangThai(t)" class="badge"
      th:classappend="${t == 'MOI'} ? 'text-bg-secondary' : (${t == 'DANG_XU_LY'} ? 'text-bg-warning' : 'text-bg-success')"
      th:text="${t == 'MOI'} ? 'Mới' : (${t == 'DANG_XU_LY'} ? 'Đang xử lý' : 'Hoàn thành')">Mới</span>

<!-- Nhãn mức ưu tiên -->
<span th:fragment="uuTien(t)" class="badge"
      th:classappend="${t == 'THAP'} ? 'text-bg-info' : (${t == 'TRUNG_BINH'} ? 'text-bg-primary' : 'text-bg-danger')"
      th:text="${t == 'THAP'} ? 'Thấp' : (${t == 'TRUNG_BINH'} ? 'Trung bình' : 'Cao')">Thấp</span>

</body>
</html>
