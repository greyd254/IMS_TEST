<!DOCTYPE html>
<!-- Layout chung: các trang gọi các fragment bên dưới bằng th:replace="~{layout :: ten_fragment}" -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(tieuDe)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${tieuDe} + ' - Quản lý sự cố CNTT'">Quản lý sự cố CNTT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
  <!-- Cần cho nút mở menu (navbar-toggler) trên màn hình nhỏ -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>

<!-- Thanh điều hướng: điện thoại hiển thị thành thanh ngang thu gọn được, từ màn hình máy tính (>=768px)
     trở thành menu dọc bên trái cố định (xem .sidebar-nav trong app.css) -->
<nav th:fragment="navbar" class="navbar navbar-expand-md navbar-dark bg-primary sidebar-nav">
  <div class="sidebar-inner">
    <div class="d-flex align-items-center justify-content-between w-100">
      <a class="navbar-brand d-flex align-items-center gap-2 mb-0" th:href="${session.nguoiDung.laAdmin()} ? @{/admin} : @{/user}">
        <i class="bi bi-headset"></i>
        <span>Sự cố CNTT - ĐH GTVT</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#scNav" aria-label="Mở menu">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
    <div class="collapse navbar-collapse" id="scNav">
      <ul class="navbar-nav">
        <li class="nav-item" th:unless="${session.nguoiDung.laAdmin()}">
          <a class="nav-link" th:href="@{/user}"><i class="bi bi-plus-circle"></i> Báo sự cố</a>
        </li>
        <li class="nav-item" th:if="${session.nguoiDung.laAdmin()}">
          <a class="nav-link" th:href="@{/admin}"><i class="bi bi-life-preserver"></i> Quản lý sự cố</a>
        </li>
        <li class="nav-item" th:if="${session.nguoiDung.laAdmin()}">
          <a class="nav-link" th:href="@{/admin/thiet-bi}"><i class="bi bi-pc-display"></i> Thiết bị</a>
        </li>
        <li class="nav-item" th:if="${session.nguoiDung.laAdmin()}">
          <a class="nav-link" th:href="@{/admin/phong}"><i class="bi bi-door-open"></i> Phòng</a>
        </li>
        <li class="nav-item" th:if="${session.nguoiDung.laAdmin()}">
          <a class="nav-link" th:href="@{/admin/danh-muc}"><i class="bi bi-tags"></i> Danh mục</a>
        </li>
        <li class="nav-item" th:if="${session.nguoiDung.laAdmin()}">
          <a class="nav-link" th:href="@{/admin/nguoi-dung}"><i class="bi bi-people"></i> Người dùng</a>
        </li>
        <li class="nav-item" th:unless="${session.nguoiDung.laAdmin()}">
          <a class="nav-link" th:href="@{/kinh-nghiem}"><i class="bi bi-journal-text"></i> Kho kinh nghiệm</a>
        </li>
        <li class="nav-item" th:if="${session.nguoiDung.laAdmin()}">
          <a class="nav-link" th:href="@{/admin/kinh-nghiem}"><i class="bi bi-journal-text"></i> Kho kinh nghiệm</a>
        </li>
      </ul>
      <span class="navbar-text d-flex align-items-center mt-3 mt-md-auto">
        <span class="avatar-chu" th:text="${#strings.toUpperCase(#strings.substring(session.nguoiDung.hoTen, 0, 1))}">?</span>
        <span>
          <span th:text="${session.nguoiDung.hoTen}">Tên</span>
          <small class="d-block opacity-75" th:text="${session.nguoiDung.laAdmin()} ? 'Quản trị (IT)' : 'Người dùng'">USER</small>
        </span>
      </span>
      <a class="btn btn-outline-light btn-sm mt-2" th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a>
    </div>
  </div>
</nav>

<!-- Thông báo thành công / lỗi (truyền qua flash attribute sau khi redirect) -->
<div th:fragment="thongbao" class="container">
  <div class="alert alert-success d-flex align-items-center gap-2 alert-dismissible fade show" th:if="${thongBao}">
    <i class="bi bi-check-circle-fill"></i> <span th:text="${thongBao}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
  </div>
  <div class="alert alert-danger d-flex align-items-center gap-2 alert-dismissible fade show" th:if="${loi}">
    <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${loi}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
  </div>
</div>

<!-- Tiêu đề trang: icon (tên class bootstrap-icons, vd 'bi-people') + chữ. Dùng BÊN TRONG .container đã có sẵn của trang. -->
<div th:fragment="tieuDe(icon, ten)" class="tieu-de-trang">
  <i th:class="'bi ' + ${icon}"></i>
  <h5 th:text="${ten}"></h5>
</div>

<!-- Nhãn trạng thái sự cố -->
<span th:fragment="trangThai(t)" class="badge"
      th:classappend="${t == 'MOI'} ? 'text-bg-secondary' : (${t == 'DANG_XU_LY'} ? 'text-bg-warning' : 'text-bg-success')"
      th:text="${t == 'MOI'} ? 'Mới' : (${t == 'DANG_XU_LY'} ? 'Đang xử lý' : 'Hoàn thành')">Mới</span>

<!-- Nhãn mức ưu tiên -->
<span th:fragment="uuTien(t)" class="badge"
      th:classappend="${t == 'THAP'} ? 'text-bg-info' : (${t == 'TRUNG_BINH'} ? 'text-bg-primary' : 'text-bg-danger')"
      th:text="${t == 'THAP'} ? 'Thấp' : (${t == 'TRUNG_BINH'} ? 'Trung bình' : 'Cao')">Thấp</span>

</body>
</html>
