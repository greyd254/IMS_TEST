<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Báo sự cố')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: thongbao}"></div>

<div class="container">
  <!-- Form báo sự cố: thiết bị, danh mục lấy từ CSDL; mức ưu tiên là danh sách cố định theo CHECK của bảng -->
  <div class="card mb-4">
    <div class="card-header"><i class="bi bi-exclamation-circle"></i>Báo sự cố mới</div>
    <div class="card-body">
      <form th:action="@{/user/bao-cao}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label" for="tieuDe">Tiêu đề</label>
          <input class="form-control" id="tieuDe" name="tieuDe" maxlength="200" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="moTa">Mô tả</label>
          <textarea class="form-control" id="moTa" name="moTa" rows="3" maxlength="1000"></textarea>
        </div>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label" for="maTb">Thiết bị</label>
            <select class="form-select" id="maTb" name="maTb">
              <option value="">-- Không liên quan thiết bị --</option>
              <option th:each="tb : ${dsThietBi}" th:value="${tb.maTb}"
                      th:text="${tb.tenTb} + ' - ' + ${tb.tenPhong}"></option>
            </select>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label" for="maDm">Danh mục</label>
            <select class="form-select" id="maDm" name="maDm" required>
              <option th:each="dm : ${dsDanhMuc}" th:value="${dm.maDm}" th:text="${dm.tenDm}"></option>
            </select>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label" for="mucUuTien">Mức ưu tiên</label>
            <select class="form-select" id="mucUuTien" name="mucUuTien" required>
              <option value="THAP">Thấp</option>
              <option value="TRUNG_BINH" selected>Trung bình</option>
              <option value="CAO">Cao</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="anh">Ảnh đính kèm (không bắt buộc)</label>
          <input class="form-control" type="file" id="anh" name="anh" accept="image/jpeg,image/png,image/gif,image/webp">
        </div>
        <button class="btn btn-primary" type="submit"><i class="bi bi-send"></i> Gửi báo cáo</button>
      </form>
    </div>
  </div>

  <!-- Thống kê từ view V_SU_CO_THUONG_GAP: giúp người dùng biết trước lỗi hay gặp và cách báo đúng danh mục -->
  <div class="card mb-4" th:if="${not #lists.isEmpty(dsHayGap)}">
    <div class="card-header"><i class="bi bi-graph-up"></i>Sự cố hay gặp</div>
    <ul class="list-group list-group-flush">
      <li class="list-group-item d-flex justify-content-between align-items-center" th:each="hg : ${dsHayGap}">
        <span th:text="${hg.tenDm}"></span>
        <span class="badge text-bg-secondary rounded-pill" th:text="${hg.soLanBao} + ' lần'"></span>
      </li>
    </ul>
  </div>

  <div th:replace="~{layout :: tieuDe('bi-list-check','Sự cố tôi đã báo')}"></div>
  <div class="card">
    <div class="table-responsive">
      <table class="table table-striped align-middle mb-0">
        <thead>
          <tr><th>Mã</th><th>Tiêu đề</th><th>Thiết bị / Phòng</th><th>Danh mục</th><th>Ưu tiên</th><th>Trạng thái</th><th>Ngày báo</th><th>Ảnh</th></tr>
        </thead>
        <tbody>
          <tr th:each="sc : ${dsSuCo}">
            <td th:text="${sc.maSc}"></td>
            <td><a th:href="@{/user/{id}(id=${sc.maSc})}" th:text="${sc.tieuDe}"></a></td>
            <td><span th:text="${sc.tenTb}">-</span><br><small class="text-muted" th:text="${sc.tenPhong}"></small></td>
            <td th:text="${sc.tenDm}"></td>
            <td><span th:replace="~{layout :: uuTien(${sc.mucUuTien})}"></span></td>
            <td><span th:replace="~{layout :: trangThai(${sc.trangThai})}"></span></td>
            <td th:text="${#temporals.format(sc.ngayTao, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
              <a th:if="${sc.anhDinhKem}" th:href="@{${sc.anhDinhKem}}" target="_blank">
                <img th:src="@{${sc.anhDinhKem}}" style="max-width:48px;max-height:48px;object-fit:cover;border-radius:.4rem;" alt="Ảnh sự cố">
              </a>
              <span th:unless="${sc.anhDinhKem}">-</span>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(dsSuCo)}">
            <td colspan="8" class="trong-rong"><i class="bi bi-inbox"></i>Bạn chưa báo sự cố nào</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
