<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Kho kinh nghiệm')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Kho kinh nghiệm xử lý sự cố</h5>
    <div class="d-flex gap-2">
      <!-- Lọc theo danh mục: gửi GET ?maDm=... -->
      <form th:action="@{/kinh-nghiem}" method="get">
        <select class="form-select" name="maDm" onchange="this.form.submit()">
          <option value="">-- Tất cả danh mục --</option>
          <option th:each="dm : ${dsDanhMuc}" th:value="${dm.maDm}" th:text="${dm.tenDm}"
                  th:selected="${dm.maDm == maDmLoc}"></option>
        </select>
      </form>
      <a th:if="${session.nguoiDung.laAdmin()}" class="btn btn-outline-primary text-nowrap"
         th:href="@{/admin/kinh-nghiem}">Quản lý</a>
    </div>
  </div>

  <div class="list-group">
    <a th:each="b : ${dsBai}" th:href="@{/kinh-nghiem/{id}(id=${b.maBai})}"
       class="list-group-item list-group-item-action">
      <div class="d-flex justify-content-between">
        <strong th:text="${b.tieuDe}"></strong>
        <span class="badge text-bg-secondary" th:text="${b.tenDm}"></span>
      </div>
      <small class="text-muted">
        <span th:text="${b.tenNguoiViet}"></span> -
        <span th:text="${#temporals.format(b.ngayTao, 'dd/MM/yyyy')}"></span>
      </small>
    </a>
    <div class="list-group-item text-muted text-center" th:if="${#lists.isEmpty(dsBai)}">Chưa có bài kinh nghiệm nào</div>
  </div>
</div>
</body>
</html>
