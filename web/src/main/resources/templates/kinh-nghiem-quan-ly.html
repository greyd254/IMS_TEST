<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Quản lý kho kinh nghiệm')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: thongbao}"></div>

<div class="container">
  <a th:href="@{/kinh-nghiem}" class="btn btn-link px-0">Xem như trang kho kinh nghiệm &raquo;</a>

  <!-- Form thêm bài kinh nghiệm mới. Sau khi thêm, bài này sẽ hiện ở đây và ở ô chọn "Bài kinh nghiệm liên quan"
       khi xử lý sự cố (xem AdminController / admin-chi-tiet.html). -->
  <div class="card mb-4">
    <div class="card-header">Thêm bài kinh nghiệm</div>
    <div class="card-body">
      <form th:action="@{/admin/kinh-nghiem}" method="post">
        <div class="row">
          <div class="col-md-8 mb-3">
            <label class="form-label" for="tieuDe">Tiêu đề</label>
            <input class="form-control" id="tieuDe" name="tieuDe" maxlength="200" required>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label" for="maDm">Danh mục</label>
            <select class="form-select" id="maDm" name="maDm" required>
              <option th:each="dm : ${dsDanhMuc}" th:value="${dm.maDm}" th:text="${dm.tenDm}"></option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="trieuChung">Triệu chứng</label>
          <textarea class="form-control" id="trieuChung" name="trieuChung" rows="2" maxlength="1000"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label" for="nguyenNhan">Nguyên nhân</label>
          <textarea class="form-control" id="nguyenNhan" name="nguyenNhan" rows="2" maxlength="1000"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label" for="giaiPhap">Giải pháp</label>
          <textarea class="form-control" id="giaiPhap" name="giaiPhap" rows="2" maxlength="1000" required></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Thêm</button>
      </form>
    </div>
  </div>

  <h5>Danh sách bài kinh nghiệm</h5>
  <table class="table table-striped align-middle">
    <thead><tr><th>Mã</th><th>Tiêu đề</th><th>Danh mục</th><th>Người viết</th><th>Ngày tạo</th><th></th></tr></thead>
    <tbody>
      <tr th:each="b : ${dsBai}">
        <td th:text="${b.maBai}"></td>
        <td th:text="${b.tieuDe}"></td>
        <td th:text="${b.tenDm}"></td>
        <td th:text="${b.tenNguoiViet}"></td>
        <td th:text="${#temporals.format(b.ngayTao, 'dd/MM/yyyy')}"></td>
        <td class="text-nowrap">
          <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/kinh-nghiem/{id}/sua(id=${b.maBai})}">Sửa</a>
          <form class="d-inline" th:action="@{/admin/kinh-nghiem/{id}/xoa(id=${b.maBai})}" method="post"
                onsubmit="return confirm('Xóa bài kinh nghiệm này?');">
            <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(dsBai)}"><td colspan="6" class="text-center text-muted">Chưa có bài kinh nghiệm</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
