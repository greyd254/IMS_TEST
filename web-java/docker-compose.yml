# App Spring Boot chay kenh bao voi Oracle da co (container oracle-23ai)
# Oracle da duoc khoi tao san: schema SUCO_APP + du lieu (quy ./init cua ban)

services:
  app:
    # Context = thu muc goc repo (chua pom.xml + src/)
    build:
      context: ..
      dockerfile: web-java/Dockerfile
    container_name: suco-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle-23ai:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: SUCO_APP
      SPRING_DATASOURCE_PASSWORD: SuCo_App_123
      APP_UPLOAD_DIR: /app/uploads
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - uploads:/app/uploads

# Gia nhap network cua compose project chua Oracle
networks:
  default:
    name: oracle_default
    external: true

volumes:
  uploads:
