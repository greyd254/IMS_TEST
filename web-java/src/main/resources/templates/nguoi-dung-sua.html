<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Sửa người dùng')}"></head>
<body>
<th:block th:replace="~{layout :: menu('nguoi-dung')}"></th:block>

<main class="noi-dung">
  <div class="container-xxl hep">
    <th:block th:replace="~{layout :: thongbao}"></th:block>

    <a th:href="@{/admin/nguoi-dung}" class="quay-lai"><i class="bi bi-arrow-left"></i> Quay lại danh sách người dùng</a>

    <div class="card">
      <div class="card-header">
        <i class="bi bi-pencil-square"></i>Sửa người dùng #<span th:text="${nd.maNd}"></span>
      </div>
      <div class="card-body">
        <form th:action="@{/admin/nguoi-dung/{id}(id=${nd.maNd})}" method="post" class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="hoTen">Họ tên <span class="text-danger">*</span></label>
            <input class="form-control" id="hoTen" name="hoTen" maxlength="100" required th:value="${nd.hoTen}">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="email">Email <span class="text-danger">*</span></label>
            <input class="form-control" type="email" id="email" name="email" maxlength="100" required th:value="${nd.email}">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="matKhau">Mật khẩu mới</label>
            <input class="form-control" type="password" id="matKhau" name="matKhau" maxlength="50"
                   placeholder="Để trống nếu không đổi" autocomplete="new-password">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="xacNhanMatKhau">Nhập lại mật khẩu mới</label>
            <input class="form-control" type="password" id="xacNhanMatKhau" name="xacNhanMatKhau" maxlength="50"
                   autocomplete="new-password" data-khop="#matKhau">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="donVi">Đơn vị</label>
            <input class="form-control" id="donVi" name="donVi" maxlength="100" th:value="${nd.donVi}">
          </div>
          <div class="col-md-6 col-6">
            <label class="form-label" for="sdt">Số điện thoại</label>
            <input class="form-control" id="sdt" name="sdt" maxlength="20" th:value="${nd.sdt}"
                   type="tel" inputmode="numeric" pattern="0[0-9]{9}"
                   title="10 chữ số, bắt đầu bằng 0 (VD 0912345678)">
          </div>
          <div class="col-md-6 col-6">
            <label class="form-label" for="vaiTro">Vai trò</label>
            <select class="form-select" id="vaiTro" name="vaiTro">
              <option th:each="e : ${dsVaiTro}" th:value="${e.key}" th:text="${e.value}"
                      th:selected="${e.key == nd.vaiTro.name()}"></option>
            </select>
          </div>
          <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Lưu</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/nguoi-dung}">Hủy</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
</body>
</html>
