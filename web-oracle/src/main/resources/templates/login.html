<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Đăng nhập')}"></head>
<body>
<div class="trang-dang-nhap">
  <div class="w-100" style="max-width: 420px;">
    <div class="card shadow">
      <div class="card-body p-4">
        <div class="bieu-tuong"><i class="bi bi-headset"></i></div>
        <h4 class="card-title text-center mb-1">Quản lý sự cố CNTT</h4>
        <p class="text-center text-muted">Trường Đại học Giao thông Vận tải</p>
        <div class="alert alert-danger d-flex align-items-center gap-2" th:if="${loi}">
          <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${loi}"></span>
        </div>
        <form th:action="@{/login}" method="post">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" required autofocus
                   autocomplete="username" inputmode="email">
          </div>
          <div class="mb-3">
            <label class="form-label" for="matKhau">Mật khẩu</label>
            <input class="form-control" type="password" id="matKhau" name="matKhau" required
                   autocomplete="current-password">
          </div>
          <button class="btn btn-primary w-100" type="submit">
            <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
