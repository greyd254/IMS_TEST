# Kết nối Oracle: PDB FREEPDB1, cổng 1521, user SUCO_APP (tạo ở sql/01_tablespace_user.sql)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=SUCO_APP
spring.datasource.password=SuCo_App_123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Cổng web
server.port=8080

# Thymeleaf: tắt cache khi phát triển để sửa giao diện thấy ngay
spring.thymeleaf.cache=false

# Bảo đảm request/response dùng UTF-8 (tiếng Việt có dấu)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Ảnh đính kèm sự cố: thư mục lưu file thật (tương đối theo nơi chạy java/mvn) và URL /uploads/** (xem WebConfig, LuuAnh)
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
